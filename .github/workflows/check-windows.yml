name: PR Check - Windows

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/workflows/setup-windows

      - name: Check
        uses: ./.github/workflows/check